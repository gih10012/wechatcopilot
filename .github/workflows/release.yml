name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test Go
        run: go test ./...
      - name: Validate Skill and repository payloads
        run: |
          python3 scripts/validate_skill.py skills/wechatcopilot
          python3 scripts/check_repository_payloads.py

  go-binaries:
    name: Go ${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build archive
        env:
          TARGET_GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p staging
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_GOARCH" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o staging/wechatcopilot ./cmd/wechatcopilot
          if [ "$TARGET_GOARCH" = "$(go env GOHOSTARCH)" ]; then
            actual_version="$(staging/wechatcopilot --json version | python3 -c 'import json, sys; print(json.load(sys.stdin)["data"]["version"])')"
            test "$actual_version" = "$VERSION"
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md staging/
          cp -R LICENSES staging/
          cp -R skills staging/
          go install github.com/google/go-licenses/v2@v2.0.1
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_GOARCH" go-licenses report ./cmd/wechatcopilot > go-licenses.csv
          python3 scripts/check_dependency_licenses.py go-licenses.csv
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_GOARCH" go-licenses save ./cmd/wechatcopilot --save_path=staging/LICENSES/go
          tar -C staging -czf "wechatcopilot-linux-${TARGET_GOARCH}.tar.gz" wechatcopilot LICENSE LICENSES THIRD_PARTY_NOTICES.md skills
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wechatcopilot-linux-${{ matrix.goarch }}
          path: wechatcopilot-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  companion:
    name: Signed Android companion
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, check licenses, and build unsigned companion
        working-directory: android
        run: ./gradlew --no-daemon :companion:testDebugUnitTest :companion:licensee :companion:assembleRelease
      - name: Sign project-owned companion
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release-keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out wechatcopilot-companion.apk \
            android/companion/build/outputs/apk/release/companion-release-unsigned.apk
          "$apksigner" verify --verbose --print-certs wechatcopilot-companion.apk
          rm -f "$RUNNER_TEMP/release-keystore.jks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wechatcopilot-companion
          path: wechatcopilot-companion.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [go-binaries, companion]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Generate SBOM and checksums
        run: |
          syft scan dir:release -o spdx-json=release/wechatcopilot.spdx.json
          cd release
          sha256sum wechatcopilot-linux-*.tar.gz wechatcopilot-companion.apk wechatcopilot.spdx.json > checksums.txt
      - name: Enforce release allowlist
        run: python3 scripts/verify_release_assets.py release
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/*"
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
